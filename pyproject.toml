[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lavoir"
version = "0.1.0"
description = "A single-pass decision model that also estimates which clarifying question is worth asking (value of information)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "laya>=0.3.11,<0.4",   # tested with 0.3.11 and 0.3.20 (identical predictions)
    "torch>=2.1",
    "transformers>=4.48",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
    "numpy>=1.20",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["lavoir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
